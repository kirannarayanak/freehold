# Start everything with:  docker compose up -d   then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freehold
      POSTGRES_USER: freehold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freehold}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freehold -d freehold"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FREEHOLD_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://freehold:${POSTGRES_PASSWORD:-freehold}@db:5432/freehold
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SOURCE_URL: ${SOURCE_URL:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Freehold <freehold@localhost>}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - data:/data

volumes:
  db:
  data:
