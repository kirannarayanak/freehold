<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freehold</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="auth" class="auth" hidden></div>

<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <div class="brand"><span class="logo" aria-hidden="true">✦</span>Freehold</div>
    <label class="sr" for="spaceSel">Space</label>
    <select id="spaceSel" class="space-sel" data-change="switchSpace"></select>
    <nav id="nav" class="nav" aria-label="Views"></nav>
    <div class="side-h">Saved filters</div>
    <div id="savedFilters" class="saved"></div>
    <div class="side-foot">
      <button class="side-link" data-act="go" data-to="#/profile">Profile and notifications</button>
      <button class="side-link" data-act="go" data-to="#/admin" id="adminLink" hidden>People (site admin)</button>
      <button class="side-link" data-act="toggleTheme">Switch light or dark theme</button>
      <button class="side-link" data-act="logout">Sign out</button>
      <p class="hint">Press Ctrl K for commands, C to create, / to search.</p>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="toggleSide" aria-label="Menu">☰</button>
      <h1 id="title">Freehold</h1>
      <div class="qwrap">
        <input id="q" class="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Filter: assignee = me AND status != Done" aria-label="Filter work items">
        <div id="qerr" class="qerr" role="status"></div>
      </div>
      <button class="icon-btn save-filter" data-act="saveFilter" title="Save this filter">Save filter</button>
      <button class="icon-btn bell" data-act="toggleNotifs" aria-label="Notifications"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.75a4 4 0 0 0-4 4v2.6L2.75 10.5v1h10.5v-1L12 8.35v-2.6a4 4 0 0 0-4-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13a1.5 1.5 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span id="badge" class="badge" hidden>0</span></button>
      <button class="icon-btn theme-btn" data-act="toggleTheme" aria-label="Switch light or dark theme"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
      <button class="btn" data-act="openCreate">Create</button>
    </header>
    <div id="qhelp" class="qhelp" hidden>
      Fields: <code>assignee</code> <code>status</code> <code>type</code> <code>priority</code> <code>label</code>
      <code>sprint</code> <code>epic</code> <code>due</code> <code>points</code> <code>created</code>.
      Operators: <code>=</code> <code>!=</code> <code>:</code> <code>&lt;</code> <code>&gt;</code> <code>in (a, b)</code>
      <code>is empty</code> <code>AND</code> <code>OR</code> <code>NOT</code> <code>ORDER BY</code>.
      Shortcuts: <code>is:open</code> <code>is:blocked</code> <code>is:overdue</code> <code>is:mine</code> <code>due &lt; 7d</code> <code>me</code>.
    </div>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<div id="notifs" class="notifs" hidden role="dialog" aria-label="Notifications"></div>
<div id="palette" class="palette" hidden role="dialog" aria-label="Command palette">
  <input id="palQ" class="pal-q" placeholder="Type a command, a key like WEB-12, or words from a title" aria-label="Command">
  <div id="palList" class="pal-list" role="listbox"></div>
</div>
<dialog id="dlg" class="dlg" aria-label="Work item"></dialog>
<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/md.js"></script>
<script src="js/oql.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
